name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu22-gcc
            os: ubuntu-22.04
            cc: gcc
            cxx: g++
          - id: ubuntu24-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Check out source and version history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ninja-build git curl python3-venv \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dri xvfb xauth xdotool x11-apps
          python3 -m venv "$RUNNER_TEMP/arrow-cmake"
          "$RUNNER_TEMP/arrow-cmake/bin/pip" install cmake==3.28.3
          echo "$RUNNER_TEMP/arrow-cmake/bin" >> "$GITHUB_PATH"

      - name: Build Release and run all headless suites
        run: ./tools/build-linux.sh -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Check release assembly guards
        run: python3 -B tests/ReleaseAssetsTests.py

      - name: Check rendering, text and developer capture scenarios
        run: bash tools/check-linux-desktop.sh -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Package, verify and launch user and portable builds
        run: |
          options=()
          if [[ '${{ matrix.id }}' == ubuntu22-gcc ]]; then options+=(--appimage); fi
          bash tools/check-linux-packages.sh "dev-${GITHUB_SHA:0:12}-${{ matrix.id }}" "${options[@]}"

      - name: Upload development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.id }}-${{ github.sha }}
          path: out/linux-package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs and desktop captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-checks-${{ matrix.id }}-${{ github.sha }}
          path: |
            build/linux/Testing/Temporary/LastTest.log
            out/linux-smoke/**/*.png
            out/linux-smoke/**/*.log
            out/linux-smoke/**/*.xwd
            out/linux-qa-smoke/**/*.png
            out/linux-qa-smoke/**/*.log
            out/appimage-smoke/**/*.png
            out/appimage-smoke/**/*.log
            out/appimage-smoke/**/*.xwd
            out/localization-ui/*.png
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows / MSVC x64
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and version history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Release and run all headless suites
        run: ./tools/build-windows.ps1 -Configuration Release

      - name: Check release assembly guards
        run: python -B tests/ReleaseAssetsTests.py

      - name: Check both production binaries
        run: |
          python tools/check-production-binary.py build/windows-msvc/arrow_puzzle.exe
          if ($LASTEXITCODE -ne 0) { throw 'User build validation failed.' }
          python tools/check-production-binary.py build/windows-msvc/arrow_puzzle_portable.exe --portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build validation failed.' }

      - name: Package the tested build
        run: |
          $version = 'dev-' + $env:GITHUB_SHA.Substring(0, 12)
          ./tools/package-windows.ps1 -Version $version -OutputDirectory out/ci-windows/user
          ./tools/package-windows.ps1 -Version $version -Portable -OutputDirectory out/ci-windows/portable

      - name: Upload development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msvc-${{ github.sha }}
          path: out/ci-windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-checks-${{ github.sha }}
          path: build/windows-msvc/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

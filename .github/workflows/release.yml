name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a draft release (select a vX.Y.Z tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and attest Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      commit: ${{ steps.ref.outputs.commit }}
      create_release: ${{ steps.ref.outputs.create_release }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact source and release history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify and validate the build
        id: ref
        env:
          MANUAL_RELEASE: ${{ inputs.create_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw 'Unexpected source commit.' }
          $tag = ''
          if ($env:GITHUB_REF -match '^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$') { $tag = $Matches[1] }
          $release = $env:GITHUB_EVENT_NAME -eq 'push' -or $env:MANUAL_RELEASE -eq 'true'
          if ($release -and -not $tag) { throw 'A draft release requires an existing vX.Y.Z tag.' }
          $version = if ($tag) { $tag.Substring(1) } else { 'dev-' + $commit.Substring(0, 7) }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "create_release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Release and run the complete headless test suite
        run: ./tools/build-windows.ps1 -Configuration Release

      - name: Package the executable and notices
        id: package
        run: ./tools/package-windows.ps1 -Version $env:PACKAGE_VERSION

      - name: Attest the executable and its release archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.package.outputs.exe_path }}
            ${{ steps.package.outputs.archive_path }}

      - name: Verify provenance and keep the verification bundle
        env:
          GH_TOKEN: ${{ github.token }}
          EXE_PATH: ${{ steps.package.outputs.exe_path }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          foreach ($file in @($env:EXE_PATH, $env:ARCHIVE_PATH)) {
            gh attestation verify $file --repo $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) { throw 'Build provenance verification failed.' }
          }
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination out/release/attestation.sigstore.json
          "Built from **$env:GITHUB_SHA** on GitHub-hosted Windows." >> $env:GITHUB_STEP_SUMMARY
          'The archive, SHA256SUMS.txt and Sigstore bundle are attached below.' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/release/*.zip
            out/release/SHA256SUMS.txt
            out/release/build-info.json
            out/release/attestation.sigstore.json

  release:
    name: Prepare a release with github-actions[bot]
    needs: build
    if: needs.build.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's verified files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-release-${{ github.sha }}
          path: release-files

      - name: Create or update a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          current_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')"
          test "$current_commit" = "$SOURCE_COMMIT" || { echo 'The release tag moved during this build.' >&2; exit 1; }
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            test "$draft" = 'true' || { echo 'Published release assets are never replaced. Use a new tag.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            printf 'Built and tested by GitHub Actions from commit `%s`.\n\nBuild log: %s/%s/actions/runs/%s\n\nThe ZIP and its ArrowPuzzle.exe have GitHub build-provenance attestations. See docs/en/RELEASING.md for verification instructions.\n' "$SOURCE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
            gh release create "$RELEASE_TAG" release-files/* --verify-tag --draft --title "Arrow Puzzle $RELEASE_TAG" --notes-file release-notes.md
          fi
